
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tetris test3</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f3f5f8;color:#252b38;
 font-family:system-ui,sans-serif;
 display:flex;justify-content:center;
 min-height:100dvh;overscroll-behavior:none
}
.app{
 width:min(100%,400px);padding:10px 12px;
 display:flex;flex-direction:column;gap:8px;
}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:23px;margin:0}
button{
 border:0;border-radius:12px;padding:10px;
 background:white;color:#263247;font-weight:750;
 font-size:17px;touch-action:manipulation;
 box-shadow:0 2px 5px #0000000b
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stat{background:white;border-radius:12px;padding:6px 9px}
.stat small{display:block;color:#7b8493}
.stat strong{font-size:20px}
.game{
 position:relative;align-self:center;
 width:min(100%, min(300px, 43dvh));
}
canvas{
 width:100%;height:auto;display:block;
 background:#e4e8ef;border-radius:9px;
 touch-action:none
}
.overlay{
 position:absolute;inset:0;background:#f3f5f8ed;
 display:flex;align-items:center;justify-content:center;
 text-align:center;padding:20px;border-radius:9px
}
.overlay.hidden{display:none}
.overlay p{font-size:13px;color:#667184}
.primary{background:#4d91ef;color:white;padding:12px 24px}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.controls button{min-height:43px}
.controls .small{font-size:11px}
.hint{text-align:center;color:#7b8493;font-size:11px}
@media(max-height:700px){
 .app{gap:6px;padding-top:5px}
 .game{width:min(100%, min(270px, 38dvh))}
 .stat{padding:4px 7px}
 .stat strong{font-size:18px}
 .controls button{min-height:38px}
}
</style>
</head>
<body>
<main class="app">
<header>
 <h1>Block Tetris</h1>
 <button id="restart">↻ Restart</button>
</header>

<section class="stats">
 <div class="stat"><small>Skóre</small><strong id="score">0</strong></div>
 <div class="stat"><small>Řádky</small><strong id="lines">0</strong></div>
 <div class="stat"><small>Level</small><strong id="level">1</strong></div>
</section>

<div class="game">
 <canvas id="board" width="300" height="600"></canvas>
 <div class="overlay" id="overlay">
  <div>
   <h2 id="title">Tetris</h2>
   <p id="message">Bloky automaticky padají. Dokončuj celé řádky!</p>
   <button class="primary" id="start">Hrát</button>
  </div>
 </div>
</div>

<section class="controls">
 <button id="left">←</button>
 <button id="rotate">↻</button>
 <button id="right">→</button>
 <button id="down">↓</button>
 <button class="small" id="pause">PAUZA</button>
</section>
<div class="hint">Klepnutí na pole = otočení · Přejetí = pohyb</div>
</main>

<script>
(()=>{
"use strict";
const W=10,H=20,S=30;
const COLORS={
 I:"#55b9e8",O:"#f2c451",T:"#a58ad9",
 S:"#70bd8c",Z:"#df777d",J:"#7798d4",L:"#e9a16d"
};
const SHAPES={
 I:[[1,1,1,1]],
 O:[[1,1],[1,1]],
 T:[[0,1,0],[1,1,1]],
 S:[[0,1,1],[1,1,0]],
 Z:[[1,1,0],[0,1,1]],
 J:[[1,0,0],[1,1,1]],
 L:[[0,0,1],[1,1,1]]
};
const $=id=>document.getElementById(id);
const canvas=$("board"),ctx=canvas.getContext("2d");
let board,piece,score=0,lines=0,level=1;
let running=false,paused=false,over=false;
let interval=800,timer=0,last=0,touch=null;

function newPiece(){
 const types=Object.keys(SHAPES);
 const type=types[Math.floor(Math.random()*types.length)];
 const matrix=SHAPES[type].map(r=>r.slice());
 return {type,matrix,x:Math.floor((W-matrix[0].length)/2),y:0};
}
function update(){
 $("score").textContent=score;
 $("lines").textContent=lines;
 $("level").textContent=level;
}
function message(title,text,button){
 $("title").textContent=title;
 $("message").textContent=text;
 $("start").textContent=button;
 $("overlay").classList.remove("hidden");
}
function reset(){
 board=Array.from({length:H},()=>Array(W).fill(null));
 piece=newPiece();score=0;lines=0;level=1;
 interval=800;timer=0;running=false;paused=false;over=false;
 update();draw();
 $("pause").textContent="PAUZA";
 message("Tetris","Bloky automaticky padají. Dokončuj celé řádky!","Hrát");
}
function start(){
 if(over)reset();
 running=true;paused=false;over=false;
 $("overlay").classList.add("hidden");
 $("pause").textContent="PAUZA";
 last=performance.now();
}
function collision(p,dx=0,dy=0,m=p.matrix){
 for(let y=0;y<m.length;y++)
 for(let x=0;x<m[y].length;x++){
  if(!m[y][x])continue;
  const nx=p.x+x+dx,ny=p.y+y+dy;
  if(nx<0||nx>=W||ny>=H)return true;
  if(ny>=0&&board[ny][nx])return true;
 }
 return false;
}
function lock(){
 piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{
  if(v&&piece.y+y>=0)
   board[piece.y+y][piece.x+x]=piece.type;
 }));
 let cleared=0;
 for(let y=H-1;y>=0;){
  if(board[y].every(Boolean)){
   board.splice(y,1);
   board.unshift(Array(W).fill(null));
   cleared++;
  }else y--;
 }
 if(cleared){
  score+=([0,100,300,500,800][cleared]||800)*level;
  lines+=cleared;
  level=Math.floor(lines/10)+1;
  interval=Math.max(100,800-(level-1)*60);
 }
 update();
 piece=newPiece();
 if(collision(piece))gameOver();
}
function move(dx,dy=0){
 if(!running||paused||over)return false;
 if(!collision(piece,dx,dy)){
  piece.x+=dx;piece.y+=dy;draw();return true;
 }
 if(dy>0)lock();
 draw();return false;
}
function rotate(){
 if(!running||paused||over)return;
 const m=piece.matrix;
 const r=m[0].map((_,i)=>m.map(row=>row[i]).reverse());
 for(const kick of [0,-1,1,-2,2]){
  if(!collision(piece,kick,0,r)){
   piece.x+=kick;piece.matrix=r;draw();return;
  }
 }
}
function hardDrop(){
 if(!running||paused||over)return;
 let distance=0;
 while(!collision(piece,0,1)){
  piece.y++;distance++;
 }
 score+=distance*2;
 lock();update();draw();
}
function gameOver(){
 running=false;over=true;
 message("Konec hry","Tvé skóre: "+score,"Hrát znovu");
}
function rounded(x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);
 ctx.arcTo(x+w,y+h,x,y+h,r);
 ctx.arcTo(x,y+h,x,y,r);
 ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function cell(x,y,type,alpha=1){
 if(y<0)return;
 const px=x*S+1,py=y*S+1,size=S-2;
 ctx.globalAlpha=alpha;ctx.fillStyle=COLORS[type];
 rounded(px,py,size,size,4);ctx.fill();
 ctx.fillStyle="#ffffff55";
 rounded(px+3,py+3,size-6,3,1);ctx.fill();
 ctx.globalAlpha=1;
}
function draw(){
 ctx.clearRect(0,0,300,600);
 ctx.fillStyle="#e4e8ef";ctx.fillRect(0,0,300,600);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  if(board[y][x])cell(x,y,board[y][x]);
  else{
   ctx.fillStyle="#d7dde7";
   rounded(x*S+2,y*S+2,S-4,S-4,4);ctx.fill();
  }
 }
 if(piece){
  let ghost=piece.y;
  while(!collision({...piece,y:ghost},0,1))ghost++;
  piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{
   if(v)cell(piece.x+x,ghost+y,piece.type,.25);
  }));
  piece.matrix.forEach((row,y)=>row.forEach((v,x)=>{
   if(v)cell(piece.x+x,piece.y+y,piece.type);
  }));
 }
}
function tick(now=0){
 const dt=Math.min(now-last,100);last=now;
 if(running&&!paused&&!over){
  timer+=dt;
  if(timer>=interval){timer=0;move(0,1);}
 }
 draw();requestAnimationFrame(tick);
}
function togglePause(){
 if(over)return;
 if(!running){start();return;}
 paused=!paused;
 $("pause").textContent=paused?"POKRAČOVAT":"PAUZA";
 if(paused)message("Pauza","Hra je pozastavená.","Pokračovat");
 else $("overlay").classList.add("hidden");
}
$("start").onclick=start;
$("restart").onclick=reset;
$("pause").onclick=togglePause;
$("left").onclick=()=>move(-1);
$("right").onclick=()=>move(1);
$("rotate").onclick=rotate;
$("down").onclick=()=>{if(move(0,1)){score++;update();}};
document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowDown","ArrowUp"," ","p","P"].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft")move(-1);
 if(e.key==="ArrowRight")move(1);
 if(e.key==="ArrowDown"){if(move(0,1)){score++;update();}}
 if(e.key==="ArrowUp"||e.key==="x")rotate();
 if(e.key===" ")hardDrop();
 if(e.key==="p"||e.key==="P")togglePause();
});
canvas.addEventListener("touchstart",e=>{
 const t=e.changedTouches[0];touch={x:t.clientX,y:t.clientY};
},{passive:true});
canvas.addEventListener("touchend",e=>{
 if(!touch||!running||paused){touch=null;return;}
 const t=e.changedTouches[0];
 const dx=t.clientX-touch.x,dy=t.clientY-touch.y;
 if(Math.abs(dx)<18&&Math.abs(dy)<18)rotate();
 else if(Math.abs(dx)>Math.abs(dy)){
  const n=Math.min(5,Math.max(1,Math.round(Math.abs(dx)/30)));
  for(let i=0;i<n;i++)move(dx>0?1:-1);
 }else if(dy>30){
  if(dy>100)hardDrop();else move(0,1);
 }
 touch=null;
},{passive:true});
document.addEventListener("visibilitychange",()=>{
 if(document.hidden&&running&&!paused)togglePause();
});
reset();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
