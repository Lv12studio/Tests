
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tetris</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #757575;
  color: #000000;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
  touch-action: manipulation;
}
.game { width: 100%; max-width: 360px; text-align: center; }
h1 { margin: 0 0 8px; font-size: 30px; }
.stats {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.stat {
  flex: 1;
  background: white;
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 2px 5px #0000000b;
}
.stat small { display: block; color: #777b89; font-size: 12px; }
.stat strong { font-size: 20px; }
canvas {
  display: block;
  width: min(100%, 300px);
  height: auto;
  margin: auto;
  background: #e7e9f0;
  border: 3px solid #d8dbe5;
  border-radius: 8px;
}
.controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 12px;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 14px 0;
  font-size: 21px;
  font-weight: bold;
  background: white;
  color: #303342;
  box-shadow: 0 3px 0 #d8dbe5;
  touch-action: manipulation;
}
button:active { transform: translateY(2px); box-shadow: none; }
#drop { background: #dce8ff; }
#restart {
  margin-top: 12px;
  width: 100%;
  font-size: 15px;
  padding: 11px;
  background: #303342;
  color: white;
  box-shadow: none;
}
p { font-size: 12px; color: #777b89; margin: 12px 0 0; }
</style>
</head>
<body>
<div class="game">
  <h1>TETRIS</h1>

  <div class="stats">
    <div class="stat"><small>SKÓRE</small><strong id="score">0</strong></div>
    <div class="stat"><small>ŘÁDKY</small><strong id="lines">0</strong></div>
    <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
  </div>

  <canvas id="board" width="300" height="600"></canvas>

  <div class="controls">
    <button id="left" aria-label="Doleva">←</button>
    <button id="rotate" aria-label="Otočit">↻</button>
    <button id="right" aria-label="Doprava">→</button>
    <button id="drop" aria-label="Dolů">↓</button>
  </div>

  <button id="restart">Restartovat hru</button>
  <p>← → pohyb · ↻ otočení · ↓ rychleji dolů</p>
</div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

const COLS = 10;
const ROWS = 20;
const SIZE = 30;

const colors = [
  null,
  "#64b5f6",
  "#ffca5c",
  "#b69cff",
  "#65d6a2",
  "#ff8d9c",
  "#69c9d8",
  "#ffad69"
];

const shapes = [
  [[1,1,1,1]],
  [[2,2],[2,2]],
  [[0,3,0],[3,3,3]],
  [[0,4,4],[4,4,0]],
  [[5,5,0],[0,5,5]],
  [[6,0,0],[6,6,6]],
  [[0,0,7],[7,7,7]]
];

let grid, piece, score, lines, level;
let gameOver, lastTime, dropCounter, dropInterval;
let running = false;

function newPiece() {
  const shape = shapes[Math.floor(Math.random() * shapes.length)];
  return {
    matrix: shape.map(row => row.slice()),
    x: Math.floor(COLS / 2) - Math.ceil(shape[0].length / 2),
    y: 0
  };
}

function reset() {
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  score = 0;
  lines = 0;
  level = 1;
  dropInterval = 800;
  dropCounter = 0;
  lastTime = 0;
  gameOver = false;
  piece = newPiece();
  running = true;
  updateStats();
  draw();
}

function collision(p, dx = 0, dy = 0, matrix = p.matrix) {
  for (let y = 0; y < matrix.length; y++) {
    for (let x = 0; x < matrix[y].length; x++) {
      if (!matrix[y][x]) continue;
      const nx = p.x + x + dx;
      const ny = p.y + y + dy;

      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && grid[ny][nx]) return true;
    }
  }
  return false;
}

function move(dx, dy) {
  if (gameOver) return false;

  if (!collision(piece, dx, dy)) {
    piece.x += dx;
    piece.y += dy;
    draw();
    return true;
  }

  if (dy > 0) lockPiece();
  return false;
}

function rotatePiece() {
  if (gameOver) return;

  const old = piece.matrix;
  const rotated = old[0].map((_, i) =>
    old.map(row => row[i]).reverse()
  );

  for (const offset of [0, -1, 1, -2, 2]) {
    if (!collision(piece, offset, 0, rotated)) {
      piece.x += offset;
      piece.matrix = rotated;
      draw();
      return;
    }
  }
}

function lockPiece() {
  piece.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value) {
        const gy = piece.y + y;
        const gx = piece.x + x;
        if (gy >= 0) grid[gy][gx] = value;
      }
    });
  });

  clearRows();

  piece = newPiece();

  if (collision(piece)) {
    gameOver = true;
    running = false;
  }

  updateStats();
  draw();
}

function clearRows() {
  let clearedRows = 0;

  outer:
  for (let y = ROWS - 1; y >= 0; y--) {
    for (let x = 0; x < COLS; x++) {
      if (!grid[y][x]) continue outer;
    }

    grid.splice(y, 1);
    grid.unshift(Array(COLS).fill(0));
    clearedRows++;
    y++;
  }

  if (clearedRows > 0) {
    const points = [0, 100, 300, 500, 800];
    score += (points[clearedRows] || clearedRows * 200) * level;
    lines += clearedRows;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 800 - (level - 1) * 65);
  }
}

function drawBlock(x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * SIZE + 1, y * SIZE + 1, SIZE - 2, SIZE - 2);

  ctx.fillStyle = "rgba(255,255,255,0.22)";
  ctx.fillRect(x * SIZE + 3, y * SIZE + 3, SIZE - 6, 4);

  ctx.strokeStyle = "rgba(50,50,70,0.08)";
  ctx.strokeRect(x * SIZE + 1, y * SIZE + 1, SIZE - 2, SIZE - 2);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#e7e9f0";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  grid.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value) drawBlock(x, y, colors[value]);
    });
  });

  if (piece) {
    piece.matrix.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value && piece.y + y >= 0) {
          drawBlock(piece.x + x, piece.y + y, colors[value]);
        }
      });
    });
  }

  if (gameOver) {
    ctx.fillStyle = "rgba(244,245,248,0.86)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#252735";
    ctx.textAlign = "center";
    ctx.font = "bold 25px system-ui";
    ctx.fillText("GAME OVER", canvas.width / 2, 275);
    ctx.font = "15px system-ui";
    ctx.fillText("Stiskni Restartovat", canvas.width / 2, 305);
  }
}

function updateStats() {
  document.getElementById("score").textContent = score;
  document.getElementById("lines").textContent = lines;
  document.getElementById("level").textContent = level;
}

function update(time = 0) {
  if (!running) return;

  const delta = time - lastTime;
  lastTime = time;
  dropCounter += delta;

  if (dropCounter >= dropInterval) {
    move(0, 1);
    dropCounter = 0;
  }

  if (running) requestAnimationFrame(update);
}

document.getElementById("left").addEventListener("click", () => move(-1, 0));
document.getElementById("right").addEventListener("click", () => move(1, 0));
document.getElementById("rotate").addEventListener("click", rotatePiece);

document.getElementById("drop").addEventListener("click", () => {
  if (!gameOver) {
    move(0, 1);
    dropCounter = 0;
  }
});

document.getElementById("restart").addEventListener("click", () => {
  reset();
  requestAnimationFrame(update);
});

document.addEventListener("keydown", event => {
  if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(event.key)) {
    event.preventDefault();
  }

  if (event.key === "ArrowLeft") move(-1, 0);
  if (event.key === "ArrowRight") move(1, 0);
  if (event.key === "ArrowDown") {
    move(0, 1);
    dropCounter = 0;
  }
  if (event.key === "ArrowUp") rotatePiece();
  if (event.key === " " && !gameOver) {
    while (move(0, 1)) {}
  }
});

reset();
requestAnimationFrame(update);
</script>
</body>
</html>
